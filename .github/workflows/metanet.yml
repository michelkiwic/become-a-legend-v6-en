name: Verify Metanet build

on:
  push:
    branches: [metanet-ready]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metanet-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metanet-ready
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci && npm run test:metanet
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: metanet-website
          path: source/metanet-dist/
          include-hidden-files: true
